# E2E (CI y local): carpetas sintéticas como ubicaciones bajo /mnt, montadas igual en `web` y `worker`.
#   mkdir -p dev-data/e2e/expedientes/2024 dev-data/e2e/expedientes/2025 dev-data/e2e/proyectos/2024 dev-data/e2e-out
#   chmod 777 dev-data/e2e-out          # el contenedor escribe con el uid 10001
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
# Solo carpetas sintéticas creadas por el propio CI (repositorio público).
# `litellm-fake` (Fase 8) es un LiteLLM Proxy falso (docker/e2e/fake_litellm.py) con la clave `sk-e2e-fake`: los E2E
# configuran la IA con http://litellm-fake:4000 y nada sale a la red.

x-e2e-volumes: &e2e-volumes
  - data:/data
  - workspace:/workspace
  - models:/models:ro
  - ./dev-data/e2e:/mnt/e2e:ro
  - ./dev-data/e2e-out:/mnt/e2e-out

services:
  web:
    volumes: *e2e-volumes
    environment:
      # Cada test inicia sesión desde la misma IP: el límite por IP (Fase 10) lo prueban los tests de la API.
      DOW_RATE_LIMIT_LOGIN: "1000"
  worker:
    volumes: *e2e-volumes
    environment:
      # Un tramo por documento: el escaneo E2E (2 documentos) recorre de verdad el reciclado del subproceso (G38).
      DOW_SCAN_RECYCLE_DOCUMENTS: "1"
  litellm-fake:
    image: doc_organize_web:${DOW_TAG:-dev}
    entrypoint: ["python", "/e2e/fake_litellm.py"]
    command: []
    volumes:
      - ./docker/e2e:/e2e:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
