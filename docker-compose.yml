# doc_organize_web — despliegue en el servidor Linux (D9) o local.
#   python scripts/generate_secrets.py   # una vez: crea secrets/*.txt (git-ignored)
#   docker compose up -d --build
#   http://127.0.0.1:8080
# `web` sirve la API y la SPA; `worker` ejecuta las operaciones en cola (ADR-002). Las ubicaciones (carpetas locales o
# montajes SMB/NFS del host) se montan bajo /mnt **en los dos servicios**, con las mismas rutas
# (docs/guides/despliegue.md).

x-app: &app
  image: doc_organize_web:${DOW_TAG:-dev}
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    DOW_LOG_LEVEL: ${DOW_LOG_LEVEL:-INFO}
  volumes:
    - data:/data
    - workspace:/workspace
  secrets:
    - dow_app_secret_key
    - dow_fernet_keys
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      # Solo localhost por defecto; en el servidor, detrás de un proxy inverso con TLS (docs/guides/despliegue.md).
      - "127.0.0.1:${DOW_PORT:-8080}:8080"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DOW_LOG_LEVEL: ${DOW_LOG_LEVEL:-INFO}
      DOW_WORKER_QUEUES: cpu
    # El worker cierra sus subprocesos al recibir SIGTERM; tiempo para que los runs queden marcados.
    stop_grace_period: 30s
    # Docling consume mucha memoria por documento (R3): límite explícito, ajustable por instancia.
    mem_limit: ${DOW_WORKER_MEM_LIMIT:-6g}
    # Sin HTTP: su salud se ve en /api/health (`worker`) y en Administración → Ajustes.
    healthcheck:
      disable: true
    # Espera a que `web` aplique las migraciones (los dos ejecutan `alembic upgrade head` al arrancar).
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
  workspace:

secrets:
  dow_app_secret_key:
    file: ./secrets/app_secret_key.txt
  dow_fernet_keys:
    file: ./secrets/fernet_keys.txt
