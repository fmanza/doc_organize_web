# doc_organize_web — despliegue en el servidor Linux (D9) o local.
#   python scripts/generate_secrets.py   # una vez: crea secrets/*.txt (git-ignored)
#   docker compose up -d --build
#   http://127.0.0.1:8080
# `web` sirve la API y la SPA; `worker` ejecuta las operaciones en cola (ADR-002). Las ubicaciones (carpetas locales o
# montajes SMB/NFS del host) se montan bajo /mnt **en los dos servicios**, con las mismas rutas
# (docs/guides/despliegue.md).
# Modelos de Docling (ADR-011), una vez y al actualizar:  docker compose --profile setup run --rm models-init
# Worker con GPU (cola gpu, driver NVIDIA >= 580):       docker compose --profile setup-gpu run --rm models-init-gpu
#                                                         docker compose --profile gpu up -d --build

x-app: &app
  image: doc_organize_web:${DOW_TAG:-dev}
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    DOW_LOG_LEVEL: ${DOW_LOG_LEVEL:-INFO}
  volumes:
    - data:/data
    - workspace:/workspace
    - models:/models:ro
  secrets:
    - dow_app_secret_key
    - dow_fernet_keys
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      # Solo localhost por defecto; en el servidor, detrás de un proxy inverso con TLS (docs/guides/despliegue.md).
      - "127.0.0.1:${DOW_PORT:-8080}:8080"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DOW_LOG_LEVEL: ${DOW_LOG_LEVEL:-INFO}
      DOW_WORKER_QUEUES: cpu
    # El worker cierra sus subprocesos al recibir SIGTERM; tiempo para que los runs queden marcados.
    stop_grace_period: 30s
    # Docling consume mucha memoria por documento (R3): límite explícito, ajustable por instancia.
    mem_limit: ${DOW_WORKER_MEM_LIMIT:-6g}
    # Sin HTTP: su salud se ve en /api/health (`worker`) y en Administración → Ajustes.
    healthcheck:
      disable: true
    # Espera a que `web` aplique las migraciones (los dos ejecutan `alembic upgrade head` al arrancar).
    depends_on:
      web:
        condition: service_healthy

  worker-gpu:
    <<: *app
    image: doc_organize_web-gpu:${DOW_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime-gpu
    profiles: ["gpu"]
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DOW_LOG_LEVEL: ${DOW_LOG_LEVEL:-INFO}
      DOW_WORKER_QUEUES: gpu
      DOW_WORKER_CONCURRENCY: "1"
    stop_grace_period: 30s
    mem_limit: ${DOW_WORKER_GPU_MEM_LIMIT:-8g}
    healthcheck:
      disable: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      web:
        condition: service_healthy

  # Descarga los modelos de Docling al volumen `models` (con red); el worker los usa sin Internet (ADR-011).
  # Opcional: `run --rm models-init download --picture-description` (describir imágenes). El manifiesto conserva los
  # grupos opcionales ya descargados (también los de `models-init-gpu`).
  # Sin secretos ni `config.db` (no pasa por el entrypoint de migraciones): solo red y el volumen de modelos.
  models-init: &models-init
    image: doc_organize_web:${DOW_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["setup"]
    entrypoint: ["python", "-m", "app.integrations.doc_organize.models"]
    command: ["download"]
    environment:
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  # Lo mismo con la imagen `runtime-gpu`, la única con EasyOCR: modelos base + EasyOCR (añade `--picture-description`
  # si también se quiere). No necesita GPU.
  models-init-gpu:
    <<: *models-init
    image: doc_organize_web-gpu:${DOW_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime-gpu
    profiles: ["setup-gpu"]
    command: ["download", "--easyocr"]

volumes:
  data:
  workspace:
  models:

secrets:
  dow_app_secret_key:
    file: ./secrets/app_secret_key.txt
  dow_fernet_keys:
    file: ./secrets/fernet_keys.txt
