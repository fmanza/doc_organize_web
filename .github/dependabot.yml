version: 2
# Una vez al mes, PR agrupados contra develop. Sin `cooldown`: la regla de versiones con ≥ 14 días está suspendida
# hasta la 1.0 (SHARED § «Dependencias»); la Fase 10 lo vuelve a poner (`cooldown: default-days: 14`).
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # doc_organize se sube a mano con su release (ADR-006); torch/torchvision siguen a docling.
      - dependency-name: doc_organize
      - dependency-name: torch
      - dependency-name: torchvision
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # ADR-001: openapi-typescript 7.x exige TypeScript ^5 y typescript-eslint 8.x <6.1.
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
