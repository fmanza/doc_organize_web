version: 2
# Una vez al mes, un único PR por ecosistema contra develop, y solo versiones con ≥ 14 días (mismo criterio que
# util_bbdd_web). Los ecosistemas uv (/backend), npm (/frontend) y docker (/docker) se añaden en la Fase 0, cuando
# existan esas carpetas: declararlos antes hace fallar cada ejecución de Dependabot.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
