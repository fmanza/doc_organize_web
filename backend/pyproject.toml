[project]
name = "doc_organize_web"
version = "0.5.0"
description = "Aplicación web multiusuario sobre doc_organize: ubicaciones, proyectos y ejecuciones agrupadas."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.1",
    "alembic>=1.16",
    "pwdlib[argon2]>=0.3",  # Argon2id para contraseñas (ADR-003)
    # doc_organize fijado por versión (ADR-006): wheel de la release v0.10.0 en GitHub, hash en uv.lock. El extra
    # site (mkdocs) ya existe en 0.10.0 y export llega con 0.11.0 (L-7); se añaden en sus fases (7 y 5).
    # rapidocr ya viene en sus dependencias base.
    "doc_organize[ai,context]==0.10.0",
    # Seguridad (Fase 4): 13.0.0 corrige 41 alertas (5 críticas) al leer JPEG, TIFF, FlashPix y PDF de usuarios.
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
]
docs = [
    "zensical>=0.0.67",  # sitio de documentación (zensical.toml en la raíz)
]
# torch y torchvision llegan con docling; se declaran aquí porque uv solo aplica [tool.uv.sources] a dependencias
# directas. Mismas cotas que docling-slim[standard]. Dos variantes incompatibles (D6): `cpu` (por defecto, imagen
# runtime) y `gpu` (imagen runtime-gpu: CUDA 13.0, driver NVIDIA >= 580, y EasyOCR para el OCR con GPU).
cpu = [
    "torch>=2.2.2,<3",
    "torchvision>=0.17,<1",
]
gpu = [
    "torch>=2.2.2,<3",
    "torchvision>=0.17,<1",
    "doc_organize[ocr-gpu]==0.10.0",
]

[tool.uv]
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]
# Cadena de suministro: solo versiones publicadas antes de esta fecha (≥ 2 semanas). Se adelanta a mano al actualizar.
exclude-newer = "2026-10-17T00:00:00Z"
# Excepciones de seguridad (2026-10-31), solo para el paquete nombrado: correcciones de alertas de Dependabot
# publicadas después de la fecha de corte. Se retiran al adelantar exclude-newer más allá de su fecha.
#   certifi 2026.10.18: retira los raíz de emSign con intermedias comprometidas (alerta crítica).
#   filelock 4.2.1: 17 alertas de bloqueos con enlaces simbólicos u otro usuario local (1 alta).
#   setuptools 84.1.0: escape de ruta en Windows al instalar wheels antiguos (baja).
# Excepciones de seguridad (2026-11-01, Fase 4): Pillow 13.0.0 (41 alertas, 5 críticas) ya entra por fecha, pero los
# docling anteriores lo limitaban a pillow<13. Solo las versiones que levantan ese límite:
#   docling y docling-slim 2.142.0, docling-core 2.104.0, docling-parse 7.22.4, docling-ibm-models 4.0.4.
[tool.uv.exclude-newer-package]
certifi = "2026-10-19T00:00:00Z"
filelock = "2026-10-18T00:00:00Z"
setuptools = "2026-10-19T20:30:00Z"
docling = "2026-10-22T15:00:00Z"
docling-slim = "2026-10-22T15:00:00Z"
docling-core = "2026-10-22T15:00:00Z"
docling-parse = "2026-10-21T12:30:00Z"
docling-ibm-models = "2026-10-21T12:00:00Z"

# docling exige torch y torchvision; los de PyPI para Linux arrastran las librerías CUDA (varios GB). Cada variante
# los toma de su índice de PyTorch (grupos `cpu` y `gpu`).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
doc_organize = { url = "https://github.com/fmanza/doc_organize/releases/download/v0.10.0/doc_organize-0.10.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cpu", group = "cpu" }, { index = "pytorch-cu130", group = "gpu" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu" }, { index = "pytorch-cu130", group = "gpu" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ es la carpeta de migraciones; sin esto ruff toma el paquete alembic por first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
# La aplicación solo corre en Linux (imagen Docker): el worker usa señales POSIX que no existen en Windows.
platform = "linux"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
# doc_organize solo se toca desde la capa anticorrupción; docling y sus dependencias no se siguen.
module = ["docling.*", "doc_organize.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere doc_organize con conversión real, GPU o montajes de red (fuera del CI)"]
addopts = "-m 'not integration'"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
