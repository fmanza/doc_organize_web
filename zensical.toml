# Sitio de documentación de doc_organize_web con Zensical (https://zensical.org).
#   uv run --frozen --project backend --only-group docs zensical serve     # http://127.0.0.1:8000, con recarga
#   uv run --frozen --project backend --only-group docs zensical build --strict
# El mismo Markdown se lee en GitHub: lo anidado en listas va a 4 espacios y las anclas conservan las tildes
# (pymdownx.slugs.slugify), como en GitHub.

[project]
site_name = "doc_organize_web"
site_description = "Aplicación web multiusuario sobre doc_organize: ubicaciones, proyectos y ejecuciones agrupadas."
site_author = "Paco Manzano"
repo_url = "https://github.com/fmanza/doc_organize_web"
repo_name = "fmanza/doc_organize_web"
edit_uri = "edit/develop/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "MIT — doc_organize_web"

nav = [
  { "Inicio" = "README.md" },
  { "Operación" = [
    "guides/despliegue.md",
    "guides/publicar_version.md",
  ] },
  { "Desarrollo" = [
    "guides/desarrollo.md",
    { "Decisiones (ADR)" = [
      "adr/ADR-001-stack-y-proyecto-aparte.md",
      "adr/ADR-002-ejecucion-de-jobs.md",
      "adr/ADR-003-autenticacion-sesiones.md",
      "adr/ADR-004-cifrado-secretos.md",
      "adr/ADR-005-workspace-estado-y-salidas.md",
      "adr/ADR-006-integracion-doc-organize.md",
    ] },
    { "Plan" = [
      "plan/README.md",
      "plan/ARQUITECTURA_PROPUESTA.md",
      "plan/ROADMAP.md",
      "plan/PARIDAD.md",
      "plan/DOC_ORGANIZE_GAPS.md",
      "plan/TAREAS_DOC_ORGANIZE.md",
      "plan/ADRS_PROPUESTOS.md",
      "plan/DEPENDENCIAS.md",
      "plan/DECISIONES_Y_RIESGOS.md",
      "plan/MEJORAS.md",
      "plan/INSTRUCCIONES_IA.md",
    ] },
  ] },
]

[project.theme]
language = "es"
features = [
  "navigation.tabs",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
# Anclas como en GitHub: minúsculas y con tildes (#4-en-producción, #configuración).
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
